<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="Fira Sans, Helvetica, Arial, sans-serif">
  <title>How the Wisdom Assistant answers</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .b{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
      .c{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.5}
      .q{fill:#eff6ff;stroke:#2563eb;stroke-width:1.5}
      .w{fill:#fff7ed;stroke:#f59e0b;stroke-width:1.5}
      .h{font-size:16px;font-weight:600;fill:#0f172a}
      .t{font-size:13px;fill:#334155}
      .s{font-size:12px;fill:#64748b}
      .m{font:11.5px Fira Code, Menlo, monospace;fill:#334155}
      .ln{stroke:#475569;stroke-width:1.6;fill:none}
      .lbl{font-size:12px;fill:#334155}
    </style>
  </defs>
  <rect width="1400" height="560" fill="#ffffff"/>
  <text x="40" y="40" font-size="20" font-weight="600" fill="#0f172a">How the Assistant answers: Claude decides what to look up, the server does the looking</text>

  <rect x="40" y="80" width="220" height="120" rx="10" class="b"/>
  <text x="58" y="108" class="h">User asks</text>
  <text x="58" y="134" class="t">"Why did the last</text>
  <text x="58" y="154" class="t">regression run fail?"</text>
  <text x="58" y="182" class="s">+ scope (module)</text>

  <rect x="300" y="80" width="260" height="120" rx="10" class="b"/>
  <text x="318" y="108" class="h">Prompt</text>
  <text x="318" y="134" class="t">rules: cite, never invent,</text>
  <text x="318" y="154" class="t">ask before any action</text>
  <text x="318" y="178" class="s">+ earlier turns as text + tool list</text>

  <rect x="600" y="80" width="250" height="120" rx="10" class="q"/>
  <text x="618" y="108" class="h">Claude picks a tool</text>
  <text x="618" y="134" class="m">list_runs(status=failure)</text>
  <text x="618" y="156" class="m">get_change(id)</text>
  <text x="618" y="178" class="m">get_diff(id, file)</text>

  <rect x="890" y="80" width="250" height="120" rx="10" class="c"/>
  <text x="908" y="108" class="h">Server runs it</text>
  <text x="908" y="134" class="t">queries MongoDB / GitHub /</text>
  <text x="908" y="154" class="t">Jenkins / TeamCity / Splunk</text>
  <text x="908" y="178" class="s">redacts + trims, writes audit</text>

  <rect x="1180" y="80" width="180" height="120" rx="10" class="b"/>
  <text x="1198" y="108" class="h">Answer</text>
  <text x="1198" y="134" class="t">streamed, with</text>
  <text x="1198" y="154" class="t">links to changes,</text>
  <text x="1198" y="174" class="t">builds, incidents</text>

  <path d="M260 140 L300 140" class="ln" marker-end="url(#a)"/>
  <path d="M560 140 L600 140" class="ln" marker-end="url(#a)"/>
  <path d="M850 140 L890 140" class="ln" marker-end="url(#a)"/>
  <path d="M1015 200 C1015 250 725 250 725 205" class="ln" marker-end="url(#a)"/>
  <text x="790" y="262" class="lbl">result back to Claude · repeat up to 8 lookups</text>
  <path d="M1140 120 L1180 120" class="ln" marker-end="url(#a)"/><text x="1143" y="112" class="lbl">done</text>

  <!-- write path -->
  <text x="40" y="320" font-size="15" font-weight="600" fill="#475569" letter-spacing=".06em">WHEN THE ANSWER IS AN ACTION</text>
  <rect x="40" y="340" width="260" height="150" rx="10" class="q"/>
  <text x="58" y="368" class="h">Claude calls a write tool</text>
  <text x="58" y="396" class="m">trigger_pipeline</text>
  <text x="58" y="416" class="m">create_agent · update_agent</text>
  <text x="58" y="436" class="m">open_setup_prs · refresh_wisdom</text>
  <text x="58" y="456" class="m">rerun_triage · analyze_incident</text>

  <rect x="340" y="340" width="300" height="150" rx="10" class="w"/>
  <text x="358" y="368" class="h">Server validates → card</text>
  <text x="358" y="396" class="t">"Run POA regression for</text>
  <text x="358" y="416" class="t">poa-service @ a1b2c3d"</text>
  <text x="358" y="446" class="t">nothing has run yet</text>
  <text x="358" y="470" class="s">invalid input goes back to Claude to fix</text>

  <rect x="680" y="340" width="260" height="150" rx="10" class="b"/>
  <text x="698" y="368" class="h">A person decides</text>
  <text x="698" y="396" class="t">Confirm or Cancel</text>
  <text x="698" y="426" class="s">claimed atomically: a double</text>
  <text x="698" y="446" class="s">click can't run it twice</text>

  <rect x="980" y="340" width="380" height="150" rx="10" class="c"/>
  <text x="998" y="368" class="h">Runs, then records</text>
  <text x="998" y="396" class="t">result shown on the card (e.g. new token once,</text>
  <text x="998" y="416" class="t">PR link, build queued) · audit entry with user</text>
  <text x="998" y="446" class="t">Claude sees the outcome on the next turn</text>

  <path d="M300 415 L340 415" class="ln" marker-end="url(#a)"/>
  <path d="M640 415 L680 415" class="ln" marker-end="url(#a)"/>
  <path d="M940 415 L980 415" class="ln" marker-end="url(#a)"/><text x="944" y="407" class="lbl">yes</text>
</svg>
