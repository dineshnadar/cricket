<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" font-family="Fira Sans, Helvetica, Arial, sans-serif">
  <title>Wisdom Ops architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
      .core{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.5}
      .group{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 5}
      .h{font-size:17px;font-weight:600;fill:#0f172a}
      .t{font-size:13.5px;fill:#334155}
      .s{font-size:12px;fill:#64748b}
      .g{font-size:14px;font-weight:600;fill:#475569;letter-spacing:.06em}
      .ln{stroke:#475569;stroke-width:1.6;fill:none}
      .dash{stroke-dasharray:6 5}
      .lbl{font-size:12px;fill:#334155}
      .lblbg{fill:#ffffff}
    </style>
  </defs>
  <rect width="1400" height="820" fill="#ffffff"/>

  <!-- Left: sources -->
  <text x="40" y="34" class="g">SOURCES</text>
  <rect x="40" y="60" width="300" height="200" rx="10" class="box"/>
  <text x="60" y="92" class="h">GitHub Enterprise</text>
  <text x="60" y="118" class="t">Repos behind the module</text>
  <text x="60" y="138" class="s">POA · check · card · CIP verification</text>
  <rect x="60" y="160" width="260" height="78" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="74" y="186" class="t">.github/workflows/wisdom-ops.yml</text>
  <text x="74" y="206" class="s">runs on every push, posts the diff</text>
  <text x="74" y="224" class="s">(no webhook admin needed)</text>

  <rect x="40" y="580" width="300" height="150" rx="10" class="box"/>
  <text x="60" y="612" class="h">Team (browser)</text>
  <text x="60" y="638" class="t">Dashboard, agents, change and</text>
  <text x="60" y="658" class="t">incident pages</text>
  <text x="60" y="684" class="t">Wisdom Assistant chat</text>
  <text x="60" y="708" class="s">nothing to install locally</text>

  <!-- Middle: Wisdom Ops -->
  <rect x="410" y="40" width="580" height="740" rx="14" class="group"/>
  <text x="430" y="72" class="g">WISDOM OPS · ONE INTERNAL SERVICE</text>

  <rect x="430" y="92" width="270" height="92" rx="10" class="core"/>
  <text x="450" y="122" class="h">Ingest API</text>
  <text x="450" y="146" class="t">/api/ingest/github</text>
  <text x="450" y="166" class="s">per-agent token · dedupe on head sha</text>

  <rect x="430" y="214" width="270" height="330" rx="10" class="core"/>
  <text x="450" y="244" class="h">Worker</text>
  <text x="450" y="272" class="t">1. Change queue → path filter</text>
  <text x="468" y="292" class="t">→ Claude triage → pipelines</text>
  <text x="468" y="312" class="t">→ email / Teams</text>
  <text x="450" y="342" class="t">2. Pipeline tracker</text>
  <text x="468" y="362" class="s">results, test counts, failure alerts</text>
  <text x="450" y="392" class="t">3. Repo poller (optional)</text>
  <text x="468" y="412" class="s">for repos without the workflow</text>
  <text x="450" y="442" class="t">4. Incident sync + analysis</text>
  <text x="468" y="462" class="s">ServiceNow → Splunk → Claude</text>
  <text x="450" y="492" class="t">5. Daily module wisdom</text>
  <text x="468" y="512" class="s">per-repo + module summaries</text>

  <rect x="430" y="574" width="270" height="186" rx="10" class="core"/>
  <text x="450" y="604" class="h">Web app (Next.js)</text>
  <text x="450" y="630" class="t">Dashboard · Agents · Changes</text>
  <text x="450" y="650" class="t">Incidents · Setup workflows</text>
  <text x="450" y="680" class="t">Wisdom Assistant</text>
  <text x="468" y="700" class="s">Claude + read tools; write actions</text>
  <text x="468" y="718" class="s">only after a human clicks Confirm</text>
  <text x="450" y="744" class="s">optional basic auth (SSO later)</text>

  <rect x="740" y="214" width="230" height="330" rx="10" class="box"/>
  <text x="760" y="244" class="h">MongoDB</text>
  <text x="760" y="272" class="t">agents</text>
  <text x="760" y="294" class="t">changes + triage</text>
  <text x="760" y="316" class="t">pipeline_runs</text>
  <text x="760" y="338" class="t">incidents + analysis</text>
  <text x="760" y="360" class="t">wisdom</text>
  <text x="760" y="382" class="t">conversations</text>
  <text x="760" y="404" class="t">assistant_actions</text>
  <text x="760" y="426" class="t">audit</text>
  <text x="760" y="460" class="s">the knowledge base the</text>
  <text x="760" y="478" class="s">Assistant answers from</text>

  <rect x="740" y="574" width="230" height="186" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="760" y="604" class="h">Guardrails</text>
  <text x="760" y="630" class="t">Redaction before any</text>
  <text x="760" y="650" class="t">LLM call (SSN, account,</text>
  <text x="760" y="670" class="t">card, DOB, secrets, emails)</text>
  <text x="760" y="700" class="t">Audit log of every</text>
  <text x="760" y="720" class="t">question, lookup, action</text>

  <!-- Right: integrations -->
  <text x="1060" y="34" class="g">INTEGRATIONS</text>
  <rect x="1060" y="60" width="300" height="100" rx="10" class="box"/>
  <text x="1080" y="92" class="h">Claude</text>
  <text x="1080" y="118" class="t">triage · incidents · wisdom · chat</text>
  <text x="1080" y="140" class="s">via approved endpoint / gateway</text>

  <rect x="1060" y="190" width="300" height="100" rx="10" class="box"/>
  <text x="1080" y="222" class="h">Test pipelines</text>
  <text x="1080" y="248" class="t">Jenkins · TeamCity · GitHub Actions</text>
  <text x="1080" y="270" class="s">trigger + track result and tests</text>

  <rect x="1060" y="320" width="300" height="90" rx="10" class="box"/>
  <text x="1080" y="352" class="h">Notifications</text>
  <text x="1080" y="378" class="t">Email (SMTP relay) · Teams card</text>

  <rect x="1060" y="440" width="300" height="100" rx="10" class="box"/>
  <text x="1080" y="472" class="h">ServiceNow</text>
  <text x="1080" y="498" class="t">pull incidents for the module</text>
  <text x="1080" y="520" class="s">optional work note with analysis</text>

  <rect x="1060" y="570" width="300" height="90" rx="10" class="box"/>
  <text x="1080" y="602" class="h">Splunk</text>
  <text x="1080" y="628" class="t">log evidence around the incident</text>

  <!-- arrows -->
  <path d="M340 140 L430 140" class="ln" marker-end="url(#a)"/>
  <rect x="346" y="116" width="78" height="18" class="lblbg"/><text x="352" y="129" class="lbl">push + diff</text>

  <path d="M320 238 C380 300 380 330 430 340" class="ln dash" marker-start="url(#a)"/>
  <rect x="300" y="282" width="84" height="18" class="lblbg"/><text x="306" y="295" class="lbl">poll · read</text>

  <path d="M700 140 L855 140 L855 214" class="ln" marker-end="url(#a)"/>
  <path d="M700 380 L740 380" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
  <path d="M700 660 L720 660 L720 500 L740 500" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
  <path d="M340 655 L430 655" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- worker → integration bus (passes between MongoDB and Guardrails) -->
  <path d="M700 520 L715 520 L715 559 L1010 559" class="ln"/>
  <path d="M1010 110 L1010 615" class="ln"/>
  <path d="M1010 110 L1060 110" class="ln" marker-end="url(#a)"/>
  <path d="M1010 240 L1060 240" class="ln" marker-end="url(#a)"/>
  <path d="M1010 365 L1060 365" class="ln" marker-end="url(#a)"/>
  <path d="M1010 490 L1060 490" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
  <path d="M1010 615 L1060 615" class="ln" marker-end="url(#a)"/>
  <rect x="822" y="551" width="150" height="16" class="lblbg"/><text x="828" y="563" class="lbl">worker → integrations</text>

  <!-- Assistant → Claude, routed below the guardrails box -->
  <path d="M565 760 L565 772 L1035 772 L1035 150 L1060 150" class="ln dash" marker-end="url(#a)"/>
  <rect x="770" y="764" width="132" height="16" class="lblbg"/><text x="776" y="776" class="lbl">Assistant → Claude</text>
</svg>
