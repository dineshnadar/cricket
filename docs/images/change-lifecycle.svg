<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="Fira Sans, Helvetica, Arial, sans-serif">
  <title>What happens on every push</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .b{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
      .c{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.5}
      .q{fill:#eff6ff;stroke:#2563eb;stroke-width:1.5}
      .x{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 5}
      .n{font:600 13px Fira Code, Menlo, monospace;fill:#16a34a}
      .h{font-size:16px;font-weight:600;fill:#0f172a}
      .t{font-size:13px;fill:#334155}
      .s{font-size:12px;fill:#64748b}
      .ln{stroke:#475569;stroke-width:1.6;fill:none}
      .lbl{font-size:12px;fill:#334155}
    </style>
  </defs>
  <rect width="1400" height="560" fill="#ffffff"/>
  <text x="40" y="40" font-size="20" font-weight="600" fill="#0f172a">Every push: nobody has to do anything</text>

  <!-- row 1 -->
  <rect x="40" y="70" width="230" height="120" rx="10" class="b"/>
  <text x="58" y="96" class="n">01</text><text x="86" y="96" class="h">Developer pushes</text>
  <text x="58" y="124" class="t">to a watched branch in any</text>
  <text x="58" y="144" class="t">module repo</text>

  <rect x="310" y="70" width="230" height="120" rx="10" class="b"/>
  <text x="328" y="96" class="n">02</text><text x="356" y="96" class="h">Workflow posts it</text>
  <text x="328" y="124" class="t">commits + file diffs sent to</text>
  <text x="328" y="144" class="t">the ingest API (≈10 s)</text>

  <rect x="580" y="70" width="230" height="120" rx="10" class="b"/>
  <text x="598" y="96" class="n">03</text><text x="626" y="96" class="h">Stored once</text>
  <text x="598" y="124" class="t">saved in MongoDB, deduped</text>
  <text x="598" y="144" class="t">on repo + head sha</text>

  <rect x="850" y="70" width="230" height="120" rx="10" class="q"/>
  <text x="868" y="96" class="n">04</text><text x="896" y="96" class="h">Path filter</text>
  <text x="868" y="124" class="t">touches a watched path?</text>
  <text x="868" y="144" class="s">plain code, no LLM call</text>

  <rect x="1120" y="70" width="240" height="120" rx="10" class="x"/>
  <text x="1140" y="104" class="h">No → "path-filtered"</text>
  <text x="1140" y="130" class="t">logged, nothing else happens</text>
  <text x="1140" y="150" class="s">(docs, UI copy, other modules)</text>

  <!-- row 2 -->
  <rect x="850" y="250" width="230" height="130" rx="10" class="q"/>
  <text x="868" y="276" class="n">05</text><text x="896" y="276" class="h">Claude triage</text>
  <text x="868" y="302" class="t">relevant? confidence,</text>
  <text x="868" y="322" class="t">risk, summary, test focus,</text>
  <text x="868" y="342" class="t">which pipelines to run</text>
  <text x="868" y="366" class="s">diff is redacted first</text>

  <rect x="1120" y="250" width="240" height="130" rx="10" class="x"/>
  <text x="1140" y="284" class="h">Below threshold →</text>
  <text x="1140" y="306" class="h">"not relevant"</text>
  <text x="1140" y="332" class="t">kept for history and</text>
  <text x="1140" y="352" class="t">the Assistant, no alerts</text>

  <rect x="580" y="250" width="230" height="130" rx="10" class="c"/>
  <text x="598" y="276" class="n">06</text><text x="626" y="276" class="h">Run tests</text>
  <text x="598" y="302" class="t">Jenkins · TeamCity ·</text>
  <text x="598" y="322" class="t">GitHub Actions, with</text>
  <text x="598" y="342" class="t">repo, branch, sha, risk</text>

  <rect x="310" y="250" width="230" height="130" rx="10" class="c"/>
  <text x="328" y="276" class="n">07</text><text x="356" y="276" class="h">Tell the team</text>
  <text x="328" y="302" class="t">email + Teams card with</text>
  <text x="328" y="322" class="t">summary, risk, test focus</text>
  <text x="328" y="342" class="t">and links</text>

  <rect x="40" y="250" width="230" height="130" rx="10" class="c"/>
  <text x="58" y="276" class="n">08</text><text x="86" y="276" class="h">Track the run</text>
  <text x="58" y="302" class="t">queued → running →</text>
  <text x="58" y="322" class="t">result + test counts</text>

  <!-- row 3 -->
  <rect x="40" y="430" width="500" height="100" rx="10" class="c"/>
  <text x="58" y="458" class="n">09</text><text x="86" y="458" class="h">Failure alert names the change</text>
  <text x="58" y="486" class="t">"poa-regression FAILURE for poa-service@a1b2c3d · 2 of 43 failed"</text>
  <text x="58" y="508" class="s">sent on failure (or always, per agent setting)</text>

  <rect x="580" y="430" width="780" height="100" rx="10" class="b"/>
  <text x="600" y="460" class="h">Later, when production breaks</text>
  <text x="600" y="486" class="t">ServiceNow incident → Claude picks log terms → Splunk search → match against 14 days of</text>
  <text x="600" y="506" class="t">relevant changes → likely cause with confidence → email/Teams + optional ServiceNow work note</text>

  <!-- arrows -->
  <path d="M270 130 L310 130" class="ln" marker-end="url(#a)"/>
  <path d="M540 130 L580 130" class="ln" marker-end="url(#a)"/>
  <path d="M810 130 L850 130" class="ln" marker-end="url(#a)"/>
  <path d="M1080 130 L1120 130" class="ln" marker-end="url(#a)"/><text x="1088" y="122" class="lbl">no</text>
  <path d="M965 190 L965 250" class="ln" marker-end="url(#a)"/><text x="972" y="226" class="lbl">yes</text>
  <path d="M1080 315 L1120 315" class="ln" marker-end="url(#a)"/><text x="1086" y="307" class="lbl">no</text>
  <path d="M850 315 L810 315" class="ln" marker-end="url(#a)"/><text x="814" y="307" class="lbl">yes</text>
  <path d="M580 315 L540 315" class="ln" marker-end="url(#a)"/>
  <path d="M310 315 L270 315" class="ln" marker-end="url(#a)"/>
  <path d="M155 380 L155 430" class="ln" marker-end="url(#a)"/>
</svg>
